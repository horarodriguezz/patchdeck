name: Release

# Push a tag like v0.2.0 to publish installers on GitHub Releases.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build, e.g. v0.2.0'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  linux:
    # Oldest supported runner → the binary runs on older glibc too
    # (Ubuntu 22.04+, Fedora 36+).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package
        run: |
          V="${TAG#v}"
          mkdir -p dist/patchdeck
          cp -r build/linux/x64/release/bundle/. dist/patchdeck/
          cp linux/packaging/dev.patchdeck.patchdeck.desktop linux/packaging/dev.patchdeck.patchdeck.svg dist/patchdeck/
          tar -C dist -czf "patchdeck-$V-linux-x64.tar.gz" patchdeck
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: patchdeck-*-linux-x64.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Installer + portable zip
        shell: pwsh
        run: |
          $v = $env:TAG.TrimStart('v')
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=$v windows\installer\patchdeck.iss
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "patchdeck-$v-windows-x64-portable.zip"
          Copy-Item build\installer\*.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            PatchdeckSetup-*.exe
            patchdeck-*-windows-x64-portable.zip

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "Patchdeck $TAG" --generate-notes
          fi
