name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Linux toolchain
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: patchdeck-linux-x64
          path: build/linux/x64/release/bundle

  fedora:
    runs-on: ubuntu-24.04
    container: fedora:41
    steps:
      - run: dnf install -y git clang cmake ninja-build pkgconf-pkg-config gtk3-devel xz-devel curl unzip xz which tar
      - uses: actions/checkout@v4
      - name: Install Flutter
        run: git clone --depth 1 -b stable https://github.com/flutter/flutter.git /opt/flutter
      - name: Build
        run: |
          git config --global --add safe.directory '*'
          export PATH=/opt/flutter/bin:$PATH
          flutter pub get
          flutter build linux --release
