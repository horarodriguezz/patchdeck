name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Linux toolchain
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build linux --release
      - name: Install script (per-user)
        run: |
          ./scripts/install.sh --skip-deps
          test -x ~/.local/lib/patchdeck/patchdeck
          desktop-file-validate ~/.local/share/applications/dev.patchdeck.patchdeck.desktop || true
          test -f ~/.local/share/icons/hicolor/scalable/apps/dev.patchdeck.patchdeck.svg
      - uses: actions/upload-artifact@v4
        with:
          name: patchdeck-linux-x64
          path: build/linux/x64/release/bundle

  fedora:
    runs-on: ubuntu-24.04
    container: fedora:41
    steps:
      - run: dnf install -y git
      - uses: actions/checkout@v4
      - name: Full install with scripts/install.sh (deps + Flutter + build + desktop entry)
        run: |
          git config --global --add safe.directory '*'
          ./scripts/install.sh
          test -x ~/.local/lib/patchdeck/patchdeck
          test -f ~/.local/share/applications/dev.patchdeck.patchdeck.desktop
          test -f ~/.local/share/icons/hicolor/scalable/apps/dev.patchdeck.patchdeck.svg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter build windows --release
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=ci windows\installer\patchdeck.iss
      - uses: actions/upload-artifact@v4
        with:
          name: patchdeck-windows-setup
          path: build/installer/*.exe
